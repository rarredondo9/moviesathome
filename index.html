<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse movies and TV Shows and build your own Watchlist">
    <title>Movies at Home</title>
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Short+Stack&display=swap" rel= "stylesheet">
    <script type="module" src="/src/js/main.mjs"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header>
        <h1><a href="/" id="home-link"> Movies at Home</a></h1>
        <nav aria-label="Main">
            <a href="/watchlist.html">Watchlist</a>
        </nav>
    </header>
    <main>
        <h2 class="hero">Find your <span>Favorite Movie/Show</span> here!</h2>

        <fieldset id="media-toggle">
            <legend>Show</legend>
            <label><input type="radio" name="media" value="movie" checked>Movies</label>
            <label><input type="radio" name="media" value="tv">TV Shows</label>
        </fieldset>

        <form id = "search-form" role="search">
            <label for="search-input">Search by Title</label>
            <input type="search" id="search-input" name="query" placeholder="e.g. Avengers">
            <button type="submit">Search</button>
        </form>

        <div id="filters">
            <label for="genre-select">Genre</label>
            <select id="genre-select">
                <option value="">All genres</option>
            </select>
        </div>

        <h2 id="list-heading">Popular right now</h2>

        <p id="status" role="status" aria-live="polite"></p>
        <ul id="movie-list" class="movie-grid"></ul>

        <nav id="pager" aria-label="Pagination" hidden>
            <button type="button" id="prev-page">Previous</button>
            <span id="page-info"></span>
            <button type="button" id="next-page">Next</button>
        </nav>
    </main>
</body>
</html>
